<svg class="chart chart--yelp-sentiment" viewBox="0 0 640 300" role="img" aria-label="Dot plot of RMSE per model; adding review sentiment lowers RMSE from about 1.44 to 1.02 for the best model" xmlns="http://www.w3.org/2000/svg"><line class="c-grid" x1="140.0" y1="22" x2="140.0" y2="260"/><text class="c-axis" x="140.0" y="282.0" text-anchor="middle">0.9</text><line class="c-grid" x1="259.0" y1="22" x2="259.0" y2="260"/><text class="c-axis" x="259.0" y="282.0" text-anchor="middle">1.1</text><line class="c-grid" x1="378.0" y1="22" x2="378.0" y2="260"/><text class="c-axis" x="378.0" y="282.0" text-anchor="middle">1.3</text><line class="c-grid" x1="497.0" y1="22" x2="497.0" y2="260"/><text class="c-axis" x="497.0" y="282.0" text-anchor="middle">1.5</text><line class="c-grid" x1="616.0" y1="22" x2="616.0" y2="260"/><text class="c-axis" x="616.0" y="282.0" text-anchor="middle">1.7</text><circle class="c-dot c-dot--hollow" cx="144" cy="10" r="4"/><text class="c-axis" x="154.0" y="14.0" text-anchor="start">ratings only</text><circle class="c-dot c-dot--acc" cx="264" cy="10" r="4"/><text class="c-axis" x="274.0" y="14.0" text-anchor="start">with review sentiment</text><text class="c-label" x="126.0" y="53.2" text-anchor="end">Stacked</text><circle class="c-dot c-dot--acc" cx="213.2" cy="49.2" r="4.5"><title>Stacked, with sentiment: RMSE 1.023</title></circle><text class="c-label" x="126.0" y="91.5" text-anchor="end">Random forest</text><line class="c-whisker" x1="219.7" y1="87.5" x2="458.3" y2="87.5"/><circle class="c-dot c-dot--hollow" cx="458.3" cy="87.5" r="4.5"><title>Random forest, ratings only: RMSE 1.435</title></circle><circle class="c-dot c-dot--acc" cx="219.7" cy="87.5" r="4.5"><title>Random forest, with sentiment: RMSE 1.034</title></circle><text class="c-label" x="126.0" y="129.8" text-anchor="end">Linear regression</text><line class="c-whisker" x1="244.1" y1="125.8" x2="460.7" y2="125.8"/><circle class="c-dot c-dot--hollow" cx="460.7" cy="125.8" r="4.5"><title>Linear regression, ratings only: RMSE 1.439</title></circle><circle class="c-dot c-dot--acc" cx="244.1" cy="125.8" r="4.5"><title>Linear regression, with sentiment: RMSE 1.075</title></circle><text class="c-label" x="126.0" y="168.2" text-anchor="end">KNN</text><line class="c-whisker" x1="269.7" y1="164.2" x2="522.6" y2="164.2"/><circle class="c-dot c-dot--hollow" cx="522.6" cy="164.2" r="4.5"><title>KNN, ratings only: RMSE 1.543</title></circle><circle class="c-dot c-dot--acc" cx="269.7" cy="164.2" r="4.5"><title>KNN, with sentiment: RMSE 1.118</title></circle><text class="c-label" x="126.0" y="206.5" text-anchor="end">SVR</text><line class="c-whisker" x1="282.8" y1="202.5" x2="493.4" y2="202.5"/><circle class="c-dot c-dot--hollow" cx="493.4" cy="202.5" r="4.5"><title>SVR, ratings only: RMSE 1.494</title></circle><circle class="c-dot c-dot--acc" cx="282.8" cy="202.5" r="4.5"><title>SVR, with sentiment: RMSE 1.140</title></circle><text class="c-label" x="126.0" y="244.8" text-anchor="end">Decision tree</text><line class="c-whisker" x1="308.4" y1="240.8" x2="571.4" y2="240.8"/><circle class="c-dot c-dot--hollow" cx="571.4" cy="240.8" r="4.5"><title>Decision tree, ratings only: RMSE 1.625</title></circle><circle class="c-dot c-dot--acc" cx="308.4" cy="240.8" r="4.5"><title>Decision tree, with sentiment: RMSE 1.183</title></circle></svg>
